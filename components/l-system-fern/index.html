<!DOCTYPE html>
<!--
  INSTALANDING.AI · L-System Fern
  slug     l-system-fern
  page     https://forevercomponents.com/components/fractals-automata/l-system-fern/
  license  MIT for this adaptation. The component itself is by Forever Components;
           their terms apply to it — see "Built on" in README.md and keep that attribution.

  MAP
  tokens    :root custom properties: --fr05-bg (near-black ground), --fr05-g1 /
            --fr05-g2 (radial glow), --fr05-cap / --fr05-cap-o (caption),
            --fr05-tip (growing-tip gold), --fr05-p0..p7 (by-depth stroke
            palette, brown -> gold -> cream); a [data-theme="light"] block
            repoints them for a pale paper ground
  sections  stage — full-viewport canvas (#fr05-c) inside #fr05-stage; caption
            bottom-left
  scripts   theme hook in <head> (?theme= / forever:theme postMessage);
            one body IIFE: pre-computes the fern once into typed Float32Array
            segments via a recursive turtle (DEPTH=5, ANG=23deg), then draws
            them branch by branch (3.4s grow, 2.2s hold, restart);
            visibilitychange pause/resume, prefers-reduced-motion static
            fallback
  assets    none: all drawing is canvas 2D, system monospace caption

  ADAPTING
  - Safe to edit: recursion depth (DEPTH=5), branch angle (ANG=23deg),
    palette (PAL / --fr05-p0..p7), grow duration (GROW_PER_SEC=SEGN/3.4),
    hold pause (holdUntil=t+2200), theme tokens in :root. The
    <script type="application/json" id="forever-agent-meta"> block lists
    editable areas, elements to preserve, and known limitations — read it
    before changing things.
  - Keep intact: the pre-computed typed Float32Array segments, the IIFE
    wrapper, the visibilitychange pause/resume, the prefers-reduced-motion
    static fallback (drawTo(SEGN)), and the theme hook (?theme= bootstrap +
    forever:theme listener + tokens).
  - The stage is tagged data-section="stage" (added while adapting).
    Background is --fr05-bg; a light theme exists via ?theme=light /
    data-theme="light".
  - NOTE: the site serves rotating variants of this component; this file is
    the version its code view showed on 2026-11-14. DEPTH=5 is near the
    9000-segment cap; depth 6+ silently truncates.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="An algorithmic fern drawing itself branch by branch via an L-system rule, growing in warm brown-to-gold then restarting.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L-System Fern</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
 /* theme tokens — dark values are the defaults (solid-dark-bg contract);
    the light re-theme is the one [data-theme="light"] block.
    --fr05-p0..p7 are the by-depth stroke palette: dark runs deep brown (near-invisible trunk) -> gold -> cream tips,
    light runs the same warm hues inverted, so the tips are the deepest sepia ink and
    the trunk sits just off the paper. Weight distribution is identical either way. */
 :root{--fr05-bg:#06070b;--fr05-g1:rgba(178,146,52,.16);--fr05-g2:rgba(200,170,110,.05);
   --fr05-cap:#fff;--fr05-cap-o:.42;--fr05-tip:#F7EFD9;
   --fr05-p0:#2e2210;--fr05-p1:#6b4a1f;--fr05-p2:#C08459;--fr05-p3:#B29234;
   --fr05-p4:#A19A87;--fr05-p5:#D9B878;--fr05-p6:#EAD9A8;--fr05-p7:#F7EFD9}
 :root[data-theme="light"]{--fr05-bg:#f6f2ea;--fr05-g1:rgba(131,107,38,.13);--fr05-g2:rgba(140,120,80,.05);
   --fr05-cap:#332813;--fr05-cap-o:.62;--fr05-tip:#66521b;
   --fr05-p0:#fbf7ef;--fr05-p1:#EAD9A8;--fr05-p2:#D9B878;--fr05-p3:#C08A5A;
   --fr05-p4:#8a6a2a;--fr05-p5:#6b4a1f;--fr05-p6:#4a3018;--fr05-p7:#2e2210}
 html,body{margin:0;height:100%;background:var(--fr05-bg);overflow:hidden}
 #fr05-stage{position:fixed;inset:0;background:
   radial-gradient(120% 90% at 50% 38%,var(--fr05-g1),transparent 55%),
   radial-gradient(140% 120% at 50% 50%,var(--fr05-g2),transparent 70%)}
 #fr05-c{position:absolute;inset:0;width:100%;height:100%}
 .cap{position:absolute;left:12px;bottom:8px;font:10px/1.4 ui-monospace,Menlo,monospace;
   letter-spacing:.14em;text-transform:uppercase;color:var(--fr05-cap);opacity:var(--fr05-cap-o)}
 @media (prefers-reduced-motion:reduce){#fr05-stage{background:none}}
</style>

<meta name="forever-preview-lifecycle" content="demo-v1">
</head>
<body>
<div id="fr05-stage" data-section="stage" role="img" aria-label="L-system fern growing and restarting"><canvas id="fr05-c"></canvas></div>
<div class="cap">L-System Fern</div>
<script>
'use strict';
(function(){
 var cv=document.getElementById('fr05-c'),ctx=cv.getContext('2d');
 var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 var preview=window.__foreverPreview;
 var demoEnabled=preview?preview.demoEnabled!==false:true;
 function shouldFrame(){return demoEnabled&&!reduce;}
 function paintNow(){cancelAnimationFrame(rafId);rafId=0;draw(performance.now());}
 function takeOver(){demoEnabled=false;paintNow();}
 window.addEventListener('forever:interactive',takeOver);
 document.addEventListener('pointerdown',takeOver,{capture:true});
 document.addEventListener('click',takeOver,{capture:true});
 document.addEventListener('keydown',function(e){if(e.key!=='Tab'&&e.key!=='Escape'&&!/^(Shift|Control|Alt|Meta)$/.test(e.key)&&!e.metaKey&&!e.ctrlKey&&!e.altKey)takeOver();},{capture:true});
 var root=document.documentElement;var ready=false;
 var W,H,DPR;
 var DEPTH=5,ANG=23*Math.PI/180;
 var segX0=new Float32Array(9000),segY0=new Float32Array(9000),segX1=new Float32Array(9000),segY1=new Float32Array(9000),segGen=new Uint8Array(9000);
 var SEGN=0;
 var PAL=['#2e2210','#6b4a1f','#C08459','#B29234','#A19A87','#D9B878','#EAD9A8','#F7EFD9'];
 var GROW_PER_SEC=SEGN/3.4;
 var running=false,rafId=0,phaseT=0,phase='grow',holdUntil=0;
 // recursive pre-computation — the turtle walks the fern as stored; every branch is generated once
 function turtle(x,y,ang,len,gen){
  if(gen>DEPTH||SEGN>=9000)return;
  var nx=x+Math.cos(ang)*len,ny=y+Math.sin(ang)*len;
  segX0[SEGN]=x;segY0[SEGN]=y;segX1[SEGN]=nx;segY1[SEGN]=ny;segGen[SEGN]=gen;SEGN++;
  // turtle is the drawing cursor — turns at ANG: branch left, trunk up, branch right, trunk up
  turtle(nx,ny,ang-ANG,len*0.74,gen+1);
  turtle(nx,ny,ang,len*0.83,gen+1);
  turtle(nx,ny,ang+ANG,len*0.74,gen+1);
  turtle(nx,ny,ang,len*0.62,gen+1);
 }
 // turtle steps are normalized so the fern always fills the same viewport fraction
 function build(){
  SEGN=0;
  // a fern is a plant with a trunk and fronds: start at the bottom centre, grow up
  turtle(0,0,-Math.PI/2,0.42,0);
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity,i;
  for(i=0;i<SEGN;i++){minX=Math.min(minX,segX0[i],segX1[i]);maxX=Math.max(maxX,segX0[i],segX1[i]);minY=Math.min(minY,segY0[i],segY1[i]);maxY=Math.max(maxY,segY0[i],segY1[i]);}
  var s=0.98*Math.min(W/(maxX-minX),H/(maxY-minY));
  for(i=0;i<SEGN;i++){segX0[i]=(segX0[i]-minX)*s;segX1[i]=(segX1[i]-minX)*s;segY0[i]=(segY0[i]-minY)*s;segY1[i]=(segY1[i]-minY)*s;}
  var ox=(W-(maxX-minX)*s)/2,oy=(H-(maxY-minY)*s)/2;
  for(i=0;i<SEGN;i++){segX0[i]+=ox;segX1[i]+=ox;segY0[i]+=oy;segY1[i]+=oy;}
  GROW_PER_SEC=SEGN/3.4;
 }
 function syncTheme(){            // re-read the palette; every stroke colour is derived from it
  PAL.length=0;var cs=getComputedStyle(root);
  for(var i=0;i<8;i++)PAL.push(cs.getPropertyValue('--fr05-p'+i).trim());
 }
 addEventListener('message',function(e){
  var d=e.data;
  if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
    root.setAttribute('data-theme',d.theme);syncTheme();if(ready)paintNow();
  }
 });
 function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(ready)paintNow();}
 function drawTo(n){
  ctx.lineCap='round';
  for(var i=0;i<n&&i<SEGN;i++){
   ctx.strokeStyle=PAL[Math.min(7,segGen[i])];
   ctx.lineWidth=segGen[i]<3?2.2:1.1;
   ctx.beginPath();ctx.moveTo(segX0[i],segY0[i]);ctx.lineTo(segX1[i],segY1[i]);ctx.stroke();
  }
  // growing tip — a soft gold point marking the newest segment
  if(n>0&&n<=SEGN){
   var x=segX1[n-1],y=segY1[n-1];
   var g=ctx.createRadialGradient(x,y,0,x,y,7);
   g.addColorStop(0,'rgba(247,239,217,.95)');
   g.addColorStop(1,'rgba(247,239,217,0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,7,0,6.2832);ctx.fill();
  }
 }
 function frame(t){
  rafId=0;
  if(document.hidden){running=false;return}
  if(phase==='grow'){
   // draw up to GROW_PER_SEC segments per second, hold 2.2s when complete, then restart
   var upto=Math.floor(phaseT*GROW_PER_SEC);
   ctx.clearRect(0,0,W,H);drawTo(Math.min(upto,SEGN));
   if(upto>=SEGN){phase='hold';holdUntil=t+2200;}
  }else if(phase==='hold'){
   if(t>=holdUntil){phase='grow';phaseT=0;}
  }
  phaseT+=1/60;
  if(shouldFrame())raf();else rafId=0;
 }
 function draw(t){frame(t)}
 function raf(){if(!rafId&&shouldFrame())rafId=requestAnimationFrame(frame)}
 function start(){if(running)return;running=true;phase='grow';phaseT=0;raf()}
 addEventListener('resize',resize);
 document.addEventListener('visibilitychange',function(){if(!document.hidden){phase='grow';phaseT=0;shouldFrame()?raf():paintNow();}});
 syncTheme();resize();ready=true;build();
 if(reduce){drawTo(SEGN);return;}
 if(shouldFrame())start();else draw(performance.now());
})();
</script>
</body>
</html>
