<meta charset="utf-8">
<meta name="description" content="Demoscene rotozoom: a chunky-pixel violet-and-cyan checker texture rotates and breathes in a continuous, hypnotic rotozoom — a classic demoscene texture effect.">

<title>Rotozoom Texture</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b0033;}
#rz-c{display:block;width:100%;height:100%;image-rendering:pixelated;}
.cap{position:fixed;left:8px;bottom:7px;
font:600 10px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.14em;
color:#f7e8ff;opacity:.34;text-transform:uppercase;pointer-events:none;user-select:none;}
</style>

<body>
<canvas id="rz-c" data-section="stage"></canvas>
<div class="cap">Rotozoom Texture</div>
<script>
(function(){
const cv=document.getElementById('rz-c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,P=3;
// chunky pixel palette: [black][deep violet][cyan][violet]
const A=[0x1b,0x00,0x33],B=[0x30,0x00,0x66],C=[0x00,0xf0,0xff],D=[0x8b,0x00,0xff];
const ch=[[0,2],[2,0],[1,3],[3,1]];
function size(){
const r=cv.getBoundingClientRect();W=Math.round(r.width);H=Math.round(r.height);
P=Math.max(3,Math.round(Math.min(W,H)/80));
cv.width=Math.ceil(W/P);cv.height=Math.ceil(H/P);
}
addEventListener('resize',size);size();
let px=0.5,py=0.5,boost=0,t=120;
addEventListener('pointermove',e=>{px=e.clientX/innerWidth;py=e.clientY/innerHeight;});
addEventListener('click',()=>{boost=1;});
function ch2(x,y,c){
const xx=x+Math.floor(c*0.5),yy=y+Math.floor(c*0.5);
return ch[((xx>>4)^(yy>>4))&1][((xx>>3)^(yy>>3))&1];
}
function frame(){
if(!reduce)t+=0.016;
boost*=0.94;
const img=ctx.createImageData(cv.width,cv.height);
const d=img.data;
const s=1.05+0.45*Math.sin(t*0.013)+boost*0.6;
const a=t*0.011;
const ca=Math.cos(a),sa=Math.sin(a);
for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++){
const p=y*cv.width+x;let idx=ch2(x,y,1);
const ux=(x-cv.width/2),uy=(y-cv.height/2);
const sx=(ux*ca-uy*sa)/s+(px-0.5)*40;
const sy=(ux*sa+uy*ca)/s+(py-0.5)*40;
const tx=Math.floor(sx/16),ty=Math.floor(sy/16);
idx=((tx+ty)&1)?(idx?C:A):(idx?D:B);
const o=p*4;d[o]=idx[0];d[o+1]=idx[1];d[o+2]=idx[2];d[o+3]=255;
}
ctx.putImageData(img,0,0);
if(!reduce)requestAnimationFrame(frame);
}
let raf=0;
function start(){if(!raf&&!reduce)raf=requestAnimationFrame(frame);}
function stop(){cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
if(reduce)frame();else start();
})();
</script>
</body>
</html>
