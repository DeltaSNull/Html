    things.
  - Keep intact: canvas sizing helper (resize handles devicePixelRatio), particle
    lifecycle (burst creates particles; step removes expired ones), reduced-motion
    guard (single burst then stop), particle cap check (parts.length < 110),

<head>
<meta charset="utf-8">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="Radial bursts of colorful glowing sparks explode, fall under gravity and fade against a near-black sky, with extra bursts on click.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firework Burst</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06060f}
  #c02-canvas{display:block;width:100%;height:100%}
  .cap{position:fixed;right:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
    color:#ffd76b;opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">

 ],
 "preserveElements": [

<body>
<canvas id="c02-canvas" class="c02-root" data-section="stage"></canvas>
<div class="cap">Firework Burst</div>
<script>
(function(){
  let demoEnabled=window.__foreverPreview?.demoEnabled!==false,sessionActive=false,takenOver=window.__foreverPreview?.interactive===true;
  function stopDemo(){if(!takenOver){sessionActive=false;takenOver=true;}demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});

const cv=document.getElementById('c02-canvas'),x=cv.getContext('2d');
let W,H,DPR,parts=[],t=0,nextLaunch=0,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const hues=[10,45,200,280,330,140];
function size(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',size);size();
function burst(cx,cy){
  const hue=hues[(Math.random()*hues.length)|0],n=28+(Math.random()*16|0);
  for(let i=0;i<n&&parts.length<110;i++){const a=(i/n)*6.283+Math.random()*0.2,sp=1+Math.random()*2.6;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,
      hue:hue+(Math.random()*30-15),r:1+Math.random()*1.6});}
}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();burst(e.clientX-r.left,e.clientY-r.top);});
function step(){
  x.fillStyle='rgba(6,6,15,0.22)';x.fillRect(0,0,W,H);
  t++;
  if(demoEnabled&&!reduce&&t>nextLaunch&&parts.length<110){nextLaunch=t+30+(Math.random()*40|0);
    burst(W*(0.25+Math.random()*0.5),H*(0.2+Math.random()*0.45));}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.vy+=0.035;p.vx*=0.985;p.vy*=0.985;p.x+=p.vx;p.y+=p.vy;p.life-=0.014;
    if(p.life<=0){parts.splice(i,1);continue;}
    x.globalAlpha=Math.max(0,p.life);
    x.fillStyle='hsl('+p.hue+',95%,'+(55+p.life*15)+'%)';
    x.beginPath();x.arc(p.x,p.y,p.r*p.life+0.4,0,7);x.fill();
  }
  x.globalAlpha=1;
}
let raf=0;function loop(){raf=0;if(document.hidden)return;step();if(!reduce&&(demoEnabled||(parts.length>0)))play();}
function play(){if(!raf&&!document.hidden){if(reduce){step();return;}raf=requestAnimationFrame(loop);}}
function stop(){cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
if(reduce)burst(W/2,H/2);['pointerdown','pointermove','pointerleave','click'].forEach(type=>cv.addEventListener(type,()=>{sessionActive=true;play();}));
play();
})();
</script>
</body>
</html>
