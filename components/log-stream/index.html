<!doctype html>
<!--
  INSTALANDING.AI · Log Stream
  slug     log-stream
  page     https://forevercomponents.com/components/terminal/log-stream/
  license  MIT for this adaptation. The component itself is by Forever Components;
           their terms apply to it — see "Built on" in README.md and keep that attribution.

  MAP
  tokens    hardcoded palette, no :root tokens: ground #0d1117, header/INFO green
            #4ade80, timestamp grey-green #8ba28b, WARN #ffa500, ERROR #ff5555,
            DEBUG #81a4bd, message #c8d0c8; font ui-monospace stack at
            clamp(11px,2.3vmin,12px)/1.55
  sections  stage — full-viewport log tail (.lg03-wrap): a header line plus a
            scrolling column of timestamped entries; role="img" with an aria-label,
            purely ambient, no click interactivity
  scripts   one inline IIFE: cycles a 20-entry pool, appends a new entry every
            650ms, trims to MAX=10 visible lines (or fewer if the column overflows),
            visibilitychange stop/play guard, prefers-reduced-motion static fallback
  assets    none: pure text/DOM, no images

  ADAPTING
  - Safe to edit: log pool entries (pool array), scroll interval (setInterval
    delay 650), max visible lines (MAX=10), level colors (.lg03-lvl-* CSS), header
    label text. The <script type="application/json" id="forever-agent-meta"> block
    lists editable areas, elements to preserve, and known limitations — read it
    before changing things.
  - Keep intact: the visibilitychange stop/play guard, the IIFE wrapper, and the
    prefers-reduced-motion static fallback (fills lines without animating).
  - Known limitations: background color hardcoded dark — edit CSS to change theme;
    no click interactivity — purely ambient; timestamps use the local clock so
    they jump on tab switch.
  - Entries wrap (overflow-wrap:anywhere) and the column is overflow:hidden, so
    there is no horizontal scroll at any viewport width.
-->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="description" content="Log Stream — Terminal. A self-contained, zero-dependency animated web component."><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log Stream</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;font:clamp(11px,2.3vmin,12px)/1.55 ui-monospace,Menlo,"Courier New",monospace}
.lg03-wrap{padding:8px 10px 24px;height:100%;display:flex;flex-direction:column;overflow:hidden}
.lg03-header{color:#4ade80;border-bottom:1px solid #1a2a1a;padding-bottom:4px;margin-bottom:6px;font-size:inherit;opacity:.8;flex-shrink:0;overflow-wrap:anywhere}
.lg03-log{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.lg03-entry{display:flex;flex-shrink:0;gap:6px;white-space:nowrap;animation:lg03-fadein .25s ease}
@keyframes lg03-fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.lg03-ts{color:#8ba28b;flex-shrink:0}
.lg03-lvl-info{color:#4ade80}
.lg03-lvl-warn{color:#ffa500}
.lg03-lvl-error{color:#ff5555}
.lg03-lvl-debug{color:#81a4bd}
.lg03-msg{color:#c8d0c8;flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere}
.lg03-cap{position:fixed;left:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:#4ade80;opacity:.35;letter-spacing:.5px;pointer-events:none;z-index:99}
.lg03-log::before{content:"";flex:1}
@media(max-width:300px){.lg03-entry{display:grid;grid-template-columns:auto 1fr;gap:0 6px}.lg03-msg{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){.lg03-entry{animation:none}}
</style><script type="application/json" id="forever-agent-meta">
{
  "file": "infinite/terminal/03-log-stream.html",
  "title": "Log Stream",

  "useWhen": "Developer dashboards, terminal-aesthetic hero sections, ops-themed loading screens or ambient backgrounds.",
  "avoidWhen": "Light-background UIs (background hardcoded dark navy). Contexts where motion competes with readable content.",

  "editableAreas": [
    "log pool entries (pool array)",
    "scroll interval (setInterval delay 650)",
    "max visible lines (MAX=10)",
    "level colors (.lg03-lvl-* CSS)",
    "header label text"
  ],
  "preserveElements": [
    "visibilitychange stop/play guard",
    "IIFE wrapper",

  ],
  "knownLimitations": [
    "Background color hardcoded dark — must edit CSS to change theme",
    "No click interactivity — purely ambient",
    "Timestamps use local clock so they jump on tab switch"
  ],

</head><body>
<div class="lg03-wrap" data-section="stage" role="img" aria-label="Simulated application log stream with timestamps, severity levels and messages.">
<div class="lg03-header">&#x2b25; LOG STREAM · app.log</div>
<div class="lg03-log" id="lg03-log"></div>
</div>
<div class="lg03-cap" aria-hidden="true">log stream</div>
<script>(()=>{
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const log=document.getElementById('lg03-log');
const MAX=10;

const pool=[
{l:'INFO', m:'server listening on :3000'},
{l:'INFO', m:'database connection established'},
{l:'DEBUG',m:'cache hit ratio 94.2%'},
{l:'INFO', m:'GET /api/v1/users 200 14ms'},
{l:'INFO', m:'GET /api/v1/posts 200 22ms'},
{l:'WARN', m:'rate limit approaching for 10.0.0.44'},
{l:'INFO', m:'POST /api/v1/auth 200 8ms'},
{l:'DEBUG',m:'worker pool: 4/8 threads active'},
{l:'INFO', m:'scheduled job: cleanup ran ok'},
{l:'WARN', m:'disk usage at 81% on /var'},
{l:'ERROR',m:'failed to reach upstream: timeout after 5000ms'},
{l:'INFO', m:'retry 1/3 for upstream request'},
{l:'INFO', m:'upstream reconnected successfully'},
{l:'DEBUG',m:'GC pause 2.1ms gen0'},
{l:'INFO', m:'GET /healthz 200 1ms'},
{l:'WARN', m:'slow query detected: 480ms on users table'},
{l:'INFO', m:'config reload: signal SIGHUP received'},
{l:'ERROR',m:'connection refused: redis:6379'},
{l:'INFO', m:'fallback to local cache active'},
{l:'DEBUG',m:'metrics flushed to statsd'},
];

let pi=Math.floor(Math.random()*pool.length);

function ts(){
const n=new Date();
return [n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');
}

function trim(){while(log.children.length>1&&(log.children.length>MAX||log.scrollHeight>log.clientHeight))log.firstChild.remove();}
addEventListener('resize',trim);
function addLine(){
const e=pool[pi%pool.length]; pi++;
const row=document.createElement('div'); row.className='lg03-entry';
const t=document.createElement('span'); t.className='lg03-ts'; t.textContent='['+ts()+']';
const lv=document.createElement('span'); lv.className='lg03-lvl-'+e.l.toLowerCase(); lv.textContent='['+e.l+']'+' '.repeat(5-e.l.length);
const m=document.createElement('span'); m.className='lg03-msg'; m.textContent=e.m;
row.appendChild(t); row.appendChild(lv); row.appendChild(m);
log.appendChild(row);
trim();
}

let timer=null;
function stop(){clearInterval(timer);}
function play(){
stop();
if(reduce){
for(let i=0;i<MAX;i++)addLine();
return;
}
if(!log.children.length)for(let i=0;i<6;i++)addLine();
timer=setInterval(addLine,650);
}

document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
play();
})();</script>
</body></html>
